<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Where MCP fits</title>
  <rect x="0" y="0" width="1400" height="560" fill="#fff" />
  <text x="40" y="56" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="28" font-weight="700">Where MCP fits</text>
  <text x="40" y="84" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="15">MCP standardises the agent-to-tools hop. The model-to-agent hop is still the provider’s tool-use format.</text>

<rect x="40" y="176" width="220" height="120" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" />
<text x="150.0" y="206" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">LLM</text>
<text x="150.0" y="226" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#5B6675" font-size="12">Bedrock Converse</text>
<text x="150.0" y="256" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Reads the schemas,</text>
<text x="150.0" y="274" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">writes name + arguments</text>
<rect x="440" y="176" width="260" height="120" rx="6" fill="#E8EEF6" stroke="#3A5F8A" stroke-width="1.25" />
<text x="570.0" y="206" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#2F5D8A" font-size="15.5" font-weight="600">My agent</text>
<text x="570.0" y="226" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#5B6675" font-size="12">Node · TypeScript</text>
<text x="570.0" y="256" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Parses the call, runs it,</text>
<text x="570.0" y="274" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">feeds the result back</text>
<rect x="880" y="176" width="240" height="120" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" />
<text x="1000.0" y="206" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">MCP server</text>
<text x="1000.0" y="226" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#5B6675" font-size="12">FastMCP · Python</text>
<text x="1000.0" y="256" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Owns the tools,</text>
<text x="1000.0" y="274" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">verifies the user’s JWT</text>
<rect x="1210" y="176" width="150" height="120" rx="8" fill="#F1F4F7" stroke="#CBD5E1" stroke-width="1" />
<text x="1224" y="198" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="11.5" font-weight="600" letter-spacing=".12em">DATA</text>
<rect x="1224" y="212" width="122" height="20" rx="4" fill="#EEF1F4" stroke="#CBD5E1" stroke-width="1" />
<text x="1285" y="226" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#5B6675" font-size="12">S3 Vectors</text>
<rect x="1224" y="238" width="122" height="20" rx="4" fill="#EEF1F4" stroke="#CBD5E1" stroke-width="1" />
<text x="1285" y="252" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#5B6675" font-size="12">Titan embed</text>
<rect x="1224" y="264" width="122" height="20" rx="4" fill="#EEF1F4" stroke="#CBD5E1" stroke-width="1" />
<text x="1285" y="278" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#5B6675" font-size="12">Strobe API</text>
<path d="M436,212 L266,212" fill="none" stroke="#23395B" stroke-width="1.5" />
<polygon points="264.95,212.00 275.45,206.75 275.45,217.25" fill="#23395B" /><text x="350" y="202" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#5B6675" font-size="12">tool schemas</text>
<path d="M264,262 L432,262" fill="none" stroke="#3A5F8A" stroke-width="1.75" stroke-dasharray="6 4" />
<polygon points="433.23,262.00 420.98,268.12 420.98,255.88" fill="#3A5F8A" /><text x="350" y="284" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="12">toolUse (text)</text>
<path d="M704,212 L872,212" fill="none" stroke="#23395B" stroke-width="1.5" />
<polygon points="873.05,212.00 862.55,217.25 862.55,206.75" fill="#23395B" /><text x="790" y="184" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#5B6675" font-size="12">tools/list</text>
<text x="790" y="202" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#5B6675" font-size="12">tools/call</text>
<path d="M876,262 L708,262" fill="none" stroke="#5B6675" stroke-width="1.5" stroke-dasharray="6 4" />
<polygon points="706.95,262.00 717.45,256.75 717.45,267.25" fill="#5B6675" /><text x="790" y="284" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#5B6675" font-size="12">results</text>
<path d="M1124,236 L1202,236" fill="none" stroke="#23395B" stroke-width="1.5" />
<polygon points="1203.05,236.00 1192.55,241.25 1192.55,230.75" fill="#23395B" /><text x="1163" y="226" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#5B6675" font-size="12">per user</text>
<path d="M150,148 L150,140 L566,140 L566,148" fill="none" stroke="#5B6675" stroke-width="1" />
<text x="358.0" y="130" text-anchor="middle" fill="#5B6675" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" font-size="11.5" font-weight="600" letter-spacing=".12em">PROVIDER TOOL-USE FORMAT</text>
<path d="M574,148 L574,140 L1000,140 L1000,148" fill="none" stroke="#23395B" stroke-width="1" />
<text x="787.0" y="130" text-anchor="middle" fill="#23395B" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" font-size="11.5" font-weight="600" letter-spacing=".12em">MCP · JSON-RPC OVER HTTP</text>
<rect x="40.0" y="344" width="424.0" height="118" rx="8" fill="#F1F4F7" stroke="#CBD5E1" stroke-width="1" />
<text x="60.0" y="376" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">Unchanged by MCP</text>
<text x="60.0" y="402" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">The model still writes a tool name and</text>
<text x="60.0" y="421" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">arguments. MCP never reaches this hop:</text>
<text x="60.0" y="440" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Converse toolUse, or a text fence.</text>
<rect x="488.0" y="344" width="424.0" height="118" rx="8" fill="#F1F4F7" stroke="#CBD5E1" stroke-width="1" />
<text x="508.0" y="376" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">tools/list  =  Step 1</text>
<text x="508.0" y="402" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Schemas come from my Python function</text>
<text x="508.0" y="421" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">signatures and docstrings, so I never</text>
<text x="508.0" y="440" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">hand-write the JSON.</text>
<rect x="936.0" y="344" width="424.0" height="118" rx="8" fill="#F1F4F7" stroke="#CBD5E1" stroke-width="1" />
<text x="956.0" y="376" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">tools/call  =  Step 3</text>
<text x="956.0" y="402" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Looking up the function by name becomes</text>
<text x="956.0" y="421" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">a network call. user_id is injected from</text>
<text x="956.0" y="440" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">the token, never chosen by the model.</text>
<path d="M40,504 L84,504" fill="none" stroke="#23395B" stroke-width="1.5" /><polygon points="85.05,504.00 74.55,509.25 74.55,498.75" fill="#23395B" /><text x="94" y="508" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="12">request</text>
<path d="M170,504 L214,504" fill="none" stroke="#5B6675" stroke-width="1.5" stroke-dasharray="6 4" /><polygon points="215.05,504.00 204.55,509.25 204.55,498.75" fill="#5B6675" /><text x="224" y="508" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="12">response</text>
<path d="M310,504 L354,504" fill="none" stroke="#3A5F8A" stroke-width="1.75" stroke-dasharray="6 4" /><polygon points="355.23,504.00 342.98,510.12 342.98,497.88" fill="#3A5F8A" /><text x="364" y="508" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="12">the tool call: tokens, parsed by my agent</text>
<text x="40" y="538" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13" font-style="italic">I can swap the model without touching the MCP server, and change the tools without touching the model code.</text>
</svg>