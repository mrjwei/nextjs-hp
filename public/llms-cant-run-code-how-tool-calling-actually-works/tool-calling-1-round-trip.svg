  <title>One tool call, end to end</title>
  <rect x="0" y="0" width="1380" height="930" fill="#fff" />
  <text x="40" y="56" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="28" font-weight="700">One tool call, end to end</text>
  <text x="40" y="84" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="15">The LLM only writes text. My agent turns that text into a real call, then hands the result back.</text>

