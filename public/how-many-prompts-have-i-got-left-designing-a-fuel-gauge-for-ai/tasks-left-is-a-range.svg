<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="0" y="0" width="1240" height="600" fill="#fff" />
  <text x="40" y="56" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="28" font-weight="700">“Tasks left” is a range, not a number</text>
  <text x="40" y="84" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="15">The same task costs a different amount every run, so any count of what’s left is an estimate with a spread.</text>

  
  <text x="40" y="140" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="11.5" font-weight="600" letter-spacing=".12em">ONE TASK</text>
  <rect x="40" y="156" width="260" height="120" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" />
  <text x="60" y="190" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">A daily news digest</text>
  <text x="60" y="216" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="13">Same skill, same prompt,</text>
  <text x="60" y="236" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="13">run again and again on</text>
  <text x="60" y="260" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#5B6675" font-size="12">Opus 5.5 · High</text>

  <path d="M300,216 C340,216 340,300 376,300" fill="none" stroke="#23395B" stroke-width="1.5" />

  
  <polygon points="377.05,300.00 366.55,305.25 366.55,294.75" fill="#23395B" /><text x="386" y="140" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="11.5" font-weight="600" letter-spacing=".12em">WHAT MOVES ITS COST EACH RUN</text>
  <rect x="386" y="156" width="372" height="330" rx="8" fill="#F1F4F7" stroke="#CBD5E1" stroke-width="1" />
  <rect x="406" y="176" width="332" height="40" rx="4" fill="#fff" stroke="#CBD5E1" stroke-width="1" /><text x="422" y="201" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="13">How long the conversation already is</text>
  <rect x="406" y="226" width="332" height="40" rx="4" fill="#fff" stroke="#CBD5E1" stroke-width="1" /><text x="422" y="251" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="13">Attached files and images</text>
  <rect x="406" y="276" width="332" height="40" rx="4" fill="#fff" stroke="#CBD5E1" stroke-width="1" /><text x="422" y="301" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="13">Model and effort level</text>
  <rect x="406" y="326" width="332" height="40" rx="4" fill="#fff" stroke="#CBD5E1" stroke-width="1" /><text x="422" y="351" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="13">Tool calls and agent loops</text>
  <rect x="406" y="376" width="332" height="40" rx="4" fill="#fff" stroke="#CBD5E1" stroke-width="1" /><text x="422" y="401" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="13">Cache hits on repeated context</text>
  <rect x="406" y="426" width="332" height="40" rx="4" fill="#fff" stroke="#CBD5E1" stroke-width="1" /><text x="422" y="451" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="13">Peak-hour rates on the session limit</text>

  <path d="M758,300 C792,300 792,300 828,300" fill="none" stroke="#23395B" stroke-width="1.5" />

  
  <polygon points="829.05,300.00 818.55,305.25 818.55,294.75" fill="#23395B" /><text x="840" y="140" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="11.5" font-weight="600" letter-spacing=".12em">DIGESTS LEFT THIS SESSION</text>
  <rect x="840" y="156" width="360" height="330" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" />
  <text x="860" y="184" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="12">Each dot: what my remaining quota would</text>
  <text x="860" y="202" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="12">buy at the cost of one past run</text>

  
  <rect x="976" y="220" width="96" height="104" rx="4" fill="#E8EEF6" />
  <line x1="880" y1="324" x2="1168" y2="324" stroke="#94A3B8" stroke-width="1" />
  <g font-size="12" fill="#5B6675">
    <line x1="912" y1="324" x2="912" y2="330" stroke="#94A3B8" stroke-width="1" /><text x="907" y="346" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="12">6</text>
    <line x1="976" y1="324" x2="976" y2="330" stroke="#94A3B8" stroke-width="1" /><text x="971" y="346" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="12">8</text>
    <line x1="1040" y1="324" x2="1040" y2="330" stroke="#94A3B8" stroke-width="1" /><text x="1031" y="346" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="12">10</text>
    <line x1="1104" y1="324" x2="1104" y2="330" stroke="#94A3B8" stroke-width="1" /><text x="1095" y="346" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="12">12</text>
    <line x1="1168" y1="324" x2="1168" y2="330" stroke="#94A3B8" stroke-width="1" /><text x="1159" y="346" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="12">14</text>
  </g>
  
  <circle cx="904" cy="312" r="6" fill="#94A3B8" />
  <circle cx="940" cy="312" r="6" fill="#94A3B8" />
  <circle cx="984" cy="312" r="6" fill="#23395B" fill-opacity=".55" />
  <circle cx="996" cy="298" r="6" fill="#23395B" fill-opacity=".55" />
  <circle cx="1004" cy="312" r="6" fill="#23395B" fill-opacity=".55" />
  <circle cx="1012" cy="284" r="6" fill="#23395B" fill-opacity=".55" />
  <circle cx="1016" cy="298" r="6" fill="#23395B" fill-opacity=".55" />
  <circle cx="1024" cy="312" r="6" fill="#23395B" fill-opacity=".55" />
  <circle cx="1030" cy="270" r="6" fill="#23395B" fill-opacity=".55" />
  <circle cx="1034" cy="284" r="6" fill="#23395B" fill-opacity=".55" />
  <circle cx="1038" cy="298" r="6" fill="#23395B" fill-opacity=".55" />
  <circle cx="1046" cy="312" r="6" fill="#23395B" fill-opacity=".55" />
  <circle cx="1052" cy="284" r="6" fill="#23395B" fill-opacity=".55" />
  <circle cx="1058" cy="298" r="6" fill="#23395B" fill-opacity=".55" />
  <circle cx="1064" cy="312" r="6" fill="#23395B" fill-opacity=".55" />
  <circle cx="1124" cy="312" r="6" fill="#94A3B8" />

  <text x="880" y="370" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="12">← long chats, big files,</text>
  <text x="880" y="386" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="12">agent loops</text>
  <text x="1168" y="370" text-anchor="end" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="12">short, cached,</text>
  <text x="1168" y="386" text-anchor="end" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="12">off-peak →</text>

  <rect x="860" y="408" width="152" height="56" rx="6" fill="#EAF3EC" stroke="#6A9C7C" />
  <text x="874" y="432" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#2F6B4A" font-size="12.5" font-weight="600">SHOW</text>
  <text x="874" y="454" fill="#2F6B4A" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600">8–11 · estimate</text>
  <rect x="1028" y="408" width="152" height="56" rx="6" fill="#FBEEEE" stroke="#C98080" stroke-dasharray="5 4" />
  <text x="1042" y="432" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#A33A3A" font-size="12.5" font-weight="600">NOT</text>
  <text x="1042" y="454" fill="#A33A3A" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600">“10 left”</text>

  <text x="40" y="540" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="13" font-style="italic">A single number reads as a promise. A labelled range from my own history is honest about the spread.</text>
  <text x="40" y="566" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="12">Numbers are illustrative.</text>
