<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Multi-head attention</title>
  <desc>The input fans out to h attention heads of width d_k, their outputs are concatenated and multiplied by W_O to give n by d_model.</desc>
  <rect x="0" y="0" width="1000" height="440" fill="#FFFFFF" />
  <text x="40" y="52" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="22" font-weight="700">Multi-head attention</text>
  <text x="40" y="78" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="15">Split attention into h smaller heads, run them side by side, then concatenate and mix with W_O.</text>
  <rect x="32" y="196" width="140" height="88" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="102.0" y="234.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">Input</text>
  <text x="102.0" y="256.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n × d_model</text>
  <rect x="228" y="96" width="196" height="292" rx="8" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="6 4" />
  <text x="244" y="120" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="12" font-weight="600" letter-spacing=".12em">h HEADS · IN PARALLEL</text>
  <rect x="248" y="136" width="156" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="326.0" y="158.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">Head 1</text>
  <text x="326.0" y="180.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n × d_k</text>
  <rect x="248" y="208" width="156" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="326.0" y="230.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">Head 2</text>
  <text x="326.0" y="252.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n × d_k</text>
  <rect x="248" y="316" width="156" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="326.0" y="338.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">Head h</text>
  <text x="326.0" y="360.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n × d_k</text>
  <text x="326" y="294" text-anchor="middle" fill="#8A94A3" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600">⋮</text>
  <path d="M172,240 C204,240 212,164 244,164" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="245.05,164.00 234.55,169.25 234.55,158.75" fill="#23395B" /><path d="M172,240 C204,240 212,236 244,236" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="245.05,236.00 234.55,241.25 234.55,230.75" fill="#23395B" /><path d="M172,240 C204,240 212,344 244,344" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="245.05,344.00 234.55,349.25 234.55,338.75" fill="#23395B" /><rect x="484" y="196" width="150" height="88" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="559.0" y="234.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">Concat</text>
  <text x="559.0" y="256.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n × (h · d_k)</text>
  <path d="M404,164 C440,164 448,240 480,240" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="481.05,240.00 470.55,245.25 470.55,234.75" fill="#23395B" /><path d="M404,236 C440,236 448,240 480,240" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="481.05,240.00 470.55,245.25 470.55,234.75" fill="#23395B" /><path d="M404,344 C440,344 448,240 480,240" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="481.05,240.00 470.55,245.25 470.55,234.75" fill="#23395B" /><rect x="690" y="206" width="104" height="68" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="742.0" y="245.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">· W_O</text>
  <path d="M634,240 L686,240" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="687.05,240.00 676.55,245.25 676.55,234.75" fill="#23395B" /><rect x="850" y="196" width="120" height="88" rx="6" fill="#E8EEF6" stroke="#3A5F8A" stroke-width="1.25" />
  <text x="910.0" y="234.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#2F5D8A" font-size="17" font-weight="600">Output</text>
  <text x="910.0" y="256.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n × d_model</text>
  <path d="M794,240 L846,240" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="847.05,240.00 836.55,245.25 836.55,234.75" fill="#23395B" /><text x="40" y="424" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="14" font-style="italic">Each head has its own W_Q, W_K, W_V and works in d_k = d_model / h, so the total cost stays about the same.</text>
</svg>