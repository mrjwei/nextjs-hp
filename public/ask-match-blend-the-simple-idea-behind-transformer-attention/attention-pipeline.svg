<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Scaled dot-product attention</title>
  <desc>X is projected into Q, K and V. Q and K produce an n by n score matrix, softmax turns it into weights A, and A times V gives the output.</desc>
  <rect x="0" y="0" width="960" height="420" fill="#FFFFFF" />
  <text x="40" y="52" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="22" font-weight="700">Scaled dot-product attention</text>
  <text x="40" y="78" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="15">Every query is compared with every key; the resulting weights decide how the values are blended.</text>
  <rect x="32" y="196" width="140" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="102.0" y="227.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">X</text>
  <text x="102.0" y="249.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="14">token embeddings</text>
  <text x="102.0" y="271.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n × d_model</text>
  <rect x="232" y="112" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="312.0" y="135.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">Query Q</text>
  <text x="312.0" y="157.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">X · W_Q</text>
  <text x="312.0" y="179.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n × d_k</text>
  <rect x="232" y="204" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="312.0" y="227.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">Key K</text>
  <text x="312.0" y="249.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">X · W_K</text>
  <text x="312.0" y="271.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n × d_k</text>
  <rect x="232" y="296" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="312.0" y="319.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">Value V</text>
  <text x="312.0" y="341.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">X · W_V</text>
  <text x="312.0" y="363.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n × d_v</text>
  <path d="M172,244 C200,244 204,152 228,152" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="229.05,152.00 218.55,157.25 218.55,146.75" fill="#23395B" /><path d="M172,244 L228,244" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="229.05,244.00 218.55,249.25 218.55,238.75" fill="#23395B" /><path d="M172,244 C200,244 204,336 228,336" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="229.05,336.00 218.55,341.25 218.55,330.75" fill="#23395B" /><rect x="452" y="156" width="170" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="537.0" y="187.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">Scores</text>
  <text x="537.0" y="209.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">Q · Kᵀ / √d_k</text>
  <text x="537.0" y="231.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n × n</text>
  <circle cx="464" cy="134" r="11" fill="#23395B" />
  <text x="464" y="138.5" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#FFFFFF" font-size="12.5" font-weight="700">1</text>
  <text x="482" y="138.5" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#23395B" font-size="12.5" font-weight="600" letter-spacing=".1em">COMPARE</text>
  <path d="M392,152 C424,152 420,190 448,190" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="449.05,190.00 438.55,195.25 438.55,184.75" fill="#23395B" /><path d="M392,244 C424,244 420,218 448,218" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="449.05,218.00 438.55,223.25 438.55,212.75" fill="#23395B" /><rect x="672" y="156" width="130" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="737.0" y="187.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">Weights A</text>
  <text x="737.0" y="209.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">softmax</text>
  <text x="737.0" y="231.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n × n</text>
  <circle cx="684" cy="134" r="11" fill="#23395B" />
  <text x="684" y="138.5" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#FFFFFF" font-size="12.5" font-weight="700">2</text>
  <text x="702" y="138.5" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#23395B" font-size="12.5" font-weight="600" letter-spacing=".1em">NORMALISE</text>
  <path d="M622,204 L668,204" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="669.05,204.00 658.55,209.25 658.55,198.75" fill="#23395B" /><rect x="780" y="290" width="148" height="96" rx="6" fill="#E8EEF6" stroke="#3A5F8A" stroke-width="1.25" />
  <text x="854.0" y="321.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#2F5D8A" font-size="17" font-weight="600">Output</text>
  <text x="854.0" y="343.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">A · V</text>
  <text x="854.0" y="365.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n × d_v</text>
  <circle cx="792" cy="268" r="11" fill="#23395B" />
  <text x="792" y="272.5" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#FFFFFF" font-size="12.5" font-weight="700">3</text>
  <text x="810" y="272.5" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#23395B" font-size="12.5" font-weight="600" letter-spacing=".1em">BLEND</text>
  <path d="M737,252 C737,300 748,320 776,320" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="777.05,320.00 766.55,325.25 766.55,314.75" fill="#23395B" /><path d="M392,336 C560,336 640,356 776,356" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="777.05,356.00 766.55,361.25 766.55,350.75" fill="#23395B" /><text x="40" y="404" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="14" font-style="italic">Each row of A sums to 1, so every output row is a weighted blend of the value vectors.</text>
</svg>