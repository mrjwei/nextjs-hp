<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Self-attention</title>
  <desc>A single sequence X produces Q, K and V, which feed one attention block that outputs n by d_v.</desc>
  <rect x="0" y="0" width="960" height="340" fill="#FFFFFF" />
  <text x="40" y="52" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="22" font-weight="700">Self-attention</text>
  <text x="40" y="78" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="15">Q, K and V are all projected from the same sequence, so tokens attend to each other.</text>
  <rect x="24" y="112" width="390" height="190" rx="8" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="6 4" />
  <text x="40" y="136" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="12" font-weight="600" letter-spacing=".12em">ONE SEQUENCE</text>
  <rect x="44" y="168" width="160" height="88" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="124.0" y="206.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">Sequence X</text>
  <text x="124.0" y="228.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n × d_model</text>
  <rect x="290" y="150" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="340.0" y="175.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">Q</text>
  <rect x="290" y="202" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="340.0" y="227.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">K</text>
  <rect x="290" y="254" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="340.0" y="279.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">V</text>
  <path d="M204,212 C240,212 246,170 286,170" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="287.05,170.00 276.55,175.25 276.55,164.75" fill="#23395B" /><path d="M204,212 L286,222" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="287.04,222.13 275.98,226.07 277.26,215.64" fill="#23395B" /><path d="M204,212 C240,212 246,274 286,274" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="287.05,274.00 276.55,279.25 276.55,268.75" fill="#23395B" /><rect x="486" y="166" width="230" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="601.0" y="197.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">Attention</text>
  <text x="601.0" y="219.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">softmax(QKᵀ/√d_k) · V</text>
  <text x="601.0" y="241.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">scores: n × n</text>
  <path d="M390,170 C434,170 440,200 482,200" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="483.05,200.00 472.55,205.25 472.55,194.75" fill="#23395B" /><path d="M390,222 L482,214" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="483.05,213.91 473.04,220.05 472.13,209.59" fill="#23395B" /><path d="M390,274 C434,274 440,228 482,228" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="483.05,228.00 472.55,233.25 472.55,222.75" fill="#23395B" /><rect x="780" y="170" width="148" height="88" rx="6" fill="#E8EEF6" stroke="#3A5F8A" stroke-width="1.25" />
  <text x="854.0" y="208.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#2F5D8A" font-size="17" font-weight="600">Output</text>
  <text x="854.0" y="230.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n × d_v</text>
  <path d="M716,214 L776,214" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="777.05,214.00 766.55,219.25 766.55,208.75" fill="#23395B" /><text x="40" y="326" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="14" font-style="italic">Causal variant: future positions are masked to −∞ before the softmax, so each token only sees the past.</text>
</svg>