<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Cross-attention</title>
  <desc>The decoder sequence produces Q; the encoder output produces K and V. Attention returns n_dec by d_v.</desc>
  <rect x="0" y="0" width="960" height="400" fill="#FFFFFF" />
  <text x="40" y="52" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="22" font-weight="700">Cross-attention</text>
  <text x="40" y="78" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="15">Queries come from one sequence, keys and values from another.</text>
  <text x="44" y="128" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="12" font-weight="600" letter-spacing=".12em">DECODER</text>
  <rect x="44" y="140" width="190" height="80" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="139.0" y="174.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">Decoder sequence</text>
  <text x="139.0" y="196.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n_dec × d_model</text>
  <text x="44" y="252" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="12" font-weight="600" letter-spacing=".12em">ENCODER</text>
  <rect x="44" y="264" width="190" height="80" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="139.0" y="298.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">Encoder output</text>
  <text x="139.0" y="320.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n_enc × d_model</text>
  <rect x="314" y="160" width="100" height="40" rx="6" fill="#E8EEF6" stroke="#3A5F8A" stroke-width="1.25" />
  <text x="364.0" y="185.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#2F5D8A" font-size="17" font-weight="600">Q</text>
  <rect x="314" y="262" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="364.0" y="287.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">K</text>
  <rect x="314" y="314" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="364.0" y="339.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">V</text>
  <path d="M234,180 L310,180" fill="none" stroke="#3A5F8A" stroke-width="1.75" />
  <polygon points="311.23,180.00 298.98,186.12 298.98,173.88" fill="#3A5F8A" /><path d="M234,304 C270,304 276,282 310,282" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="311.05,282.00 300.55,287.25 300.55,276.75" fill="#23395B" /><path d="M234,304 C270,304 276,334 310,334" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="311.05,334.00 300.55,339.25 300.55,328.75" fill="#23395B" /><rect x="500" y="206" width="230" height="104" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="615.0" y="241.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#1E293B" font-size="17" font-weight="600">Attention</text>
  <text x="615.0" y="263.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">softmax(QKᵀ/√d_k) · V</text>
  <text x="615.0" y="285.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">scores: n_dec × n_enc</text>
  <path d="M414,180 C460,180 456,236 496,236" fill="none" stroke="#3A5F8A" stroke-width="1.75" />
  <polygon points="497.23,236.00 484.98,242.12 484.98,229.88" fill="#3A5F8A" /><path d="M414,282 C450,282 460,258 496,258" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="497.05,258.00 486.55,263.25 486.55,252.75" fill="#23395B" /><path d="M414,334 C456,334 462,280 496,280" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="497.05,280.00 486.55,285.25 486.55,274.75" fill="#23395B" /><rect x="790" y="214" width="140" height="88" rx="6" fill="#E8EEF6" stroke="#3A5F8A" stroke-width="1.25" />
  <text x="860.0" y="252.0" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#2F5D8A" font-size="17" font-weight="600">Output</text>
  <text x="860.0" y="274.0" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#2F5D8A" font-size="14">n_dec × d_v</text>
  <path d="M730,258 L786,258" fill="none" stroke="#23395B" stroke-width="1.5" />
  <polygon points="787.05,258.00 776.55,263.25 776.55,252.75" fill="#23395B" /><text x="40" y="384" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,sans-serif" fill="#5B6675" font-size="14" font-style="italic">The decoder asks the questions; the encoder supplies both the labels and the content.</text>
</svg>