  <rect x="0" y="0" width="1600" height="800" fill="#fff" />
  <text x="40" y="56" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="28" font-weight="700">One spec, three runs</text>
