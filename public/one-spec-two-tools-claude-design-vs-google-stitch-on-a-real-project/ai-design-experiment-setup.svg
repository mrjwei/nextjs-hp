  <text x="40" y="140" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="11.5" font-weight="600" letter-spacing=".12em">INPUTS · SHARED BY ALL RUNS</text>
