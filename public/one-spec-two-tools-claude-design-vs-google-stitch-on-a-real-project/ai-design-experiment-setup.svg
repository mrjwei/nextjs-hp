  <text x="40" y="762" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13" font-style="italic">Same inputs, same design system: the runs converged on a style, but differed sharply in how much of the brief they delivered.</text>
