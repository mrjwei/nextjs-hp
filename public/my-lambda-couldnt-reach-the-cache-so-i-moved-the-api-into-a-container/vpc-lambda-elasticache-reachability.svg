<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803D"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/>
    </marker>
  </defs>
  <rect width="1280" height="820" fill="#F8FAFC"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#0F172A">Who can reach both the cache and DynamoDB?</text>
  <text x="40" y="74" font-size="15" fill="#475569">A cache-aside reader needs ElastiCache (private IPs, inside the VPC) for hits and DynamoDB (a public AWS endpoint) for misses.</text>

  <!-- ===== VPC ===== -->
  <rect x="40" y="100" width="920" height="660" rx="14" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="60" y="128" font-size="13" font-weight="700" letter-spacing="1.5" fill="#475569">SHARED VPC</text>

  <!-- Public subnet -->
  <rect x="60" y="142" width="860" height="160" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="76" y="166" font-size="14" font-weight="700" fill="#0F172A">Public subnet</text>
  <text x="182" y="166" font-size="14" fill="#475569">route 0.0.0.0/0 → internet gateway</text>
  <text x="76" y="262" font-size="13" fill="#64748B">The internet gateway only works for things with a public IP.</text>
  <text x="76" y="281" font-size="13" fill="#64748B">Lambda ENIs never get one, so a Lambda here couldn’t get out either.</text>

  <!-- NAT gateway -->
  <rect x="600" y="184" width="220" height="64" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="710" y="211" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">NAT gateway</text>
  <text x="710" y="232" font-size="13" fill="#475569" text-anchor="middle">swaps in its own public IP</text>
  <path d="M820,216 L918,216" stroke="#15803D" stroke-width="2" fill="none" marker-end="url(#ag)"/>

  <!-- Private subnets -->
  <rect x="60" y="326" width="860" height="414" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="76" y="350" font-size="14" font-weight="700" fill="#0F172A">Private subnets (one per AZ)</text>
  <text x="290" y="350" font-size="14" fill="#475569">route 0.0.0.0/0 → NAT gateway</text>

  <!-- Fargate task: what I shipped -->
  <rect x="80" y="376" width="280" height="92" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
  <text x="220" y="404" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Fargate task: the /a3 API</text>
  <text x="220" y="425" font-size="13" fill="#475569" text-anchor="middle">ENI created by ECS’s own</text>
  <text x="220" y="442" font-size="13" fill="#475569" text-anchor="middle">service-linked role</text>
  <text x="220" y="460" font-size="12" font-weight="700" letter-spacing="1" fill="#15803D" text-anchor="middle">WHAT I SHIPPED</text>

  <!-- Fargate → NAT (up, then right) -->
  <path d="M220,376 L220,216 L596,216" stroke="#15803D" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <text x="236" y="206" font-size="13" fill="#15803D">✓ DynamoDB, SQS, … through the NAT</text>

  <!-- ElastiCache -->
  <rect x="640" y="376" width="260" height="92" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="770" y="408" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">ElastiCache (Memcached)</text>
  <text x="770" y="429" font-size="13" fill="#475569" text-anchor="middle">private IPs only,</text>
  <text x="770" y="446" font-size="13" fill="#475569" text-anchor="middle">no public endpoint</text>

  <!-- Fargate → ElastiCache -->
  <path d="M360,422 L636,422" stroke="#15803D" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <text x="378" y="412" font-size="13" fill="#15803D">✓ cache hits</text>

  <!-- VPC-attached Lambda: what I wanted (one self-contained card, no arrows: it never got a network) -->
  <rect x="80" y="520" width="820" height="196" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="104" y="556" font-size="16" font-weight="700" fill="#64748B">VPC-attached Lambda</text>
  <text x="290" y="556" font-size="12" font-weight="700" letter-spacing="1" fill="#64748B">WHAT I WANTED</text>
  <text x="104" y="580" font-size="13" fill="#64748B">On paper it would reach both, just like the Fargate task above.</text>

  <line x1="104" y1="600" x2="876" y2="600" stroke="#E2E8F0"/>

  <circle cx="117" cy="628" r="13" fill="#FEE2E2" stroke="#B91C1C"/>
  <text x="117" y="633" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="middle">✗</text>
  <text x="142" y="633" font-size="15" font-weight="700" fill="#B91C1C">Blocked before it ever ran</text>
  <text x="142" y="660" font-size="13" fill="#7F1D1D">Lambda creates the function’s ENI with its execution role, and CAB432-Lambda-Role</text>
  <text x="142" y="679" font-size="13" fill="#7F1D1D">can’t call ec2:CreateNetworkInterface. CreateFunction failed, so there’s no ENI:</text>
  <text x="142" y="698" font-size="13" fill="#7F1D1D">no path to the cache, and no path to the NAT.</text>

  <!-- ===== Internet gateway on the VPC edge ===== -->
  <rect x="922" y="166" width="76" height="100" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="960" y="212" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Internet</text>
  <text x="960" y="229" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">gateway</text>
  <path d="M998,216 L1036,216" stroke="#15803D" stroke-width="2" fill="none" marker-end="url(#ag)"/>

  <!-- ===== Outside the VPC ===== -->
  <rect x="1040" y="150" width="210" height="132" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="1145" y="180" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Public AWS endpoints</text>
  <text x="1145" y="210" font-size="14" fill="#475569" text-anchor="middle">DynamoDB</text>
  <text x="1145" y="234" font-size="14" fill="#475569" text-anchor="middle">SQS · EventBridge · Bedrock</text>
  <text x="1145" y="266" font-size="12" fill="#64748B" text-anchor="middle">(cache misses go here)</text>

  <!-- Lambda outside the VPC -->
  <rect x="1040" y="376" width="210" height="92" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="1145" y="408" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Lambda outside the VPC</text>
  <text x="1145" y="429" font-size="13" fill="#475569" text-anchor="middle">the default: runs in a</text>
  <text x="1145" y="446" font-size="13" fill="#475569" text-anchor="middle">VPC that AWS owns</text>
  <path d="M1145,376 L1145,286" stroke="#15803D" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <text x="1155" y="336" font-size="13" fill="#15803D">✓</text>
  <path d="M1040,422 L980,422" stroke="#B91C1C" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <circle cx="960" cy="422" r="13" fill="#FEE2E2" stroke="#B91C1C"/>
  <text x="960" y="427" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="middle">✗</text>
  <text x="1145" y="494" font-size="13" fill="#B91C1C" text-anchor="middle">can’t see the cache’s</text>
  <text x="1145" y="511" font-size="13" fill="#B91C1C" text-anchor="middle">private IPs</text>

  <!-- Footer -->
  <text x="40" y="796" font-size="15" fill="#0F172A"><tspan font-weight="700">Only the Fargate task in the private subnets reaches both.</tspan> That’s why the /a3 API ended up as a container, not Lambdas.</text>
</svg>
