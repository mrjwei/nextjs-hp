<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" xmlns:c2pa="http://c2pa.org/manifest"><rect x="0" y="0" width="1400" height="560" fill="#fff" /><text x="48" y="64" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="28" font-weight="700">Nothing shows when a sensor is healthy; two tiers when it isn't</text>
<text x="48" y="94" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="15">The status model on the sensor list. Labels are the Japanese UI terms, with what each one asks of the user.</text><rect x="48" y="130" width="416" height="290" rx="8" fill="#F1F4F7" stroke="#CBD5E1" /><text x="72" y="164" font-size="11.5" font-weight="600" letter-spacing=".12em" fill="#5B6675" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif">HEALTHY</text><text x="72" y="214" font-size="30" font-weight="700" fill="#5B6675" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif">No label</text><text x="72" y="260" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">Icons stay grey</text><text x="72" y="292" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Nothing to do</text><rect x="492" y="130" width="416" height="290" rx="8" fill="#FAF3E6" stroke="#C2924E" /><text x="516" y="164" font-size="11.5" font-weight="600" letter-spacing=".12em" fill="#A8692A" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif">NEEDS CHECKING</text><text x="516" y="214" font-size="30" font-weight="700" fill="#A8692A" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif">要確認</text><text x="516" y="260" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">The readings look wrong</text><text x="516" y="292" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Sudden drop in the level graph</text><text x="516" y="316" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Graph has stopped moving</text><line x1="516" y1="350" x2="884" y2="350" stroke="#C2924E" /><text x="516" y="388" fill="#A8692A" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" font-size="15.5" font-weight="600">Check the data before trusting it</text><rect x="936" y="130" width="416" height="290" rx="8" fill="#FBEEEE" stroke="#C98080" /><text x="960" y="164" font-size="11.5" font-weight="600" letter-spacing=".12em" fill="#A33A3A" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif">NEEDS ACTION</text><text x="960" y="214" font-size="30" font-weight="700" fill="#A33A3A" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif">要対応</text><text x="960" y="260" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">The sensor itself has a problem</text><text x="960" y="292" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Communication error</text><text x="960" y="316" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Battery below its threshold</text><line x1="960" y1="350" x2="1328" y2="350" stroke="#C98080" /><text x="960" y="388" fill="#A33A3A" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" font-size="15.5" font-weight="600">Act on the device</text><rect x="48" y="448" width="1304" height="72" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" /><text x="72" y="478" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="11.5" font-weight="600" letter-spacing=".12em">PRECEDENCE</text><text x="200" y="478" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">A sensor with both kinds of problem is shown as 要対応. The open question I left behind: should it also</text><text x="200" y="500" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">appear when someone filters for 要確認? In the shipped list it does not.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>