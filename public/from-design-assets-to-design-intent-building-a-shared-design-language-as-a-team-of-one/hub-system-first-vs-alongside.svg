<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="0" y="0" width="1600" height="620" fill="#fff" />
<text x="40" y="56" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="28" font-weight="700">The same design system, built in a different order</text>
<text x="40" y="84" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="15">Building the system first made every change big. Growing it alongside the screens kept each change small enough to ship.</text>
<text x="40" y="140" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#A33A3A" font-size="11.5" font-weight="600" letter-spacing=".12em">FIRST ATTEMPT · SYSTEM FIRST</text>
<rect x="40" y="156" width="320" height="112" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" />
<text x="60" y="194" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">Build the design system</text>
<text x="60" y="220" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">About a month of tokens and</text>
<text x="60" y="239" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">components, before any screen.</text>
<rect x="440" y="156" width="320" height="112" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" />
<text x="460" y="194" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">Polish dozens of screens</text>
<text x="460" y="220" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">The system didn't fit them, so</text>
<text x="460" y="239" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">I kept adding and removing parts.</text>
<rect x="840" y="156" width="320" height="112" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" />
<text x="860" y="194" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">Hand over the whole revamp</text>
<text x="860" y="220" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Big, polished, and resting on</text>
<text x="860" y="239" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">little user evidence.</text>
<rect x="1240" y="156" width="320" height="112" rx="6" fill="#FBEEEE" stroke="#C98080" stroke-width="1" stroke-dasharray="5 4" />
<text x="1260" y="194" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#A33A3A" font-size="15.5" font-weight="600">Not built</text>
<text x="1260" y="220" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Too risky for a live service and</text>
<text x="1260" y="239" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">beyond engineering capacity.</text>
<line x1="362" y1="212.0" x2="438" y2="212.0" fill="none" stroke="#23395B" stroke-width="1.5" />
<polygon points="439.05,212.00 428.55,217.25 428.55,206.75" fill="#23395B" /><line x1="762" y1="212.0" x2="838" y2="212.0" fill="none" stroke="#23395B" stroke-width="1.5" />
<polygon points="839.05,212.00 828.55,217.25 828.55,206.75" fill="#23395B" /><line x1="1162" y1="212.0" x2="1238" y2="212.0" fill="none" stroke="#23395B" stroke-width="1.5" />
<polygon points="1239.05,212.00 1228.55,217.25 1228.55,206.75" fill="#23395B" /><text x="40" y="330" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#2F6B4A" font-size="11.5" font-weight="600" letter-spacing=".12em">AFTER THE TURNING POINT · SYSTEM ALONGSIDE</text>
<rect x="40" y="346" width="320" height="112" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" />
<text x="60" y="384" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">Screenshot a live screen</text>
<text x="60" y="410" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Use it as the background of a</text>
<text x="60" y="429" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">date-stamped Figma section.</text>
<rect x="440" y="346" width="320" height="112" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" />
<text x="460" y="384" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">Redesign one area</text>
<text x="460" y="410" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Leave the rest of the screen</text>
<text x="460" y="429" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">exactly as it is.</text>
<rect x="840" y="346" width="320" height="112" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" />
<text x="860" y="384" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">Discuss and iterate</text>
<text x="860" y="410" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Small, rough changes are cheap</text>
<text x="860" y="429" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">to change or throw away.</text>
<rect x="1240" y="346" width="320" height="112" rx="6" fill="#EAF3EC" stroke="#6A9C7C" stroke-width="1" />
<text x="1260" y="384" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#2F6B4A" font-size="15.5" font-weight="600">Add components only if needed</text>
<text x="1260" y="410" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">The system grows with the design,</text>
<text x="1260" y="429" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">and I declutter it regularly.</text>
<line x1="362" y1="402.0" x2="438" y2="402.0" fill="none" stroke="#23395B" stroke-width="1.5" />
<polygon points="439.05,402.00 428.55,407.25 428.55,396.75" fill="#23395B" /><line x1="762" y1="402.0" x2="838" y2="402.0" fill="none" stroke="#23395B" stroke-width="1.5" />
<polygon points="839.05,402.00 828.55,407.25 828.55,396.75" fill="#23395B" /><line x1="1162" y1="402.0" x2="1238" y2="402.0" fill="none" stroke="#23395B" stroke-width="1.5" />
<polygon points="1239.05,402.00 1228.55,407.25 1228.55,396.75" fill="#23395B" /><path d="M1400,460 L1400,500 L200,500 L200,462" fill="none" stroke="#5B6675" stroke-width="1.5" stroke-dasharray="6 4" />
<polygon points="200.00,460.95 205.25,471.45 194.75,471.45" fill="#5B6675" /><text x="800" y="522" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="12">next screen, next area</text>
<text x="40" y="580" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13" font-style="italic">Screens ended up mixing old and new UI. I accepted that trade-off on purpose: it kept each change buildable.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>