<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="0" y="0" width="1600" height="650" fill="#fff" />
<text x="40" y="56" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="28" font-weight="700">Two halves, one job: a shared design language</text>
<text x="40" y="84" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="15">Before AI, design assets carried my team's decisions. With AI, written design intent carried them.</text>
<text x="40" y="110" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,Consolas,monospace" fill="#8A94A3" font-size="13">nearly 4 years · the only product designer · late 2022 → Sep 2026</text>
<text x="40" y="152" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="11.5" font-weight="600" letter-spacing=".12em">FIRST HALF · LATE 2022 → 2024 · BEFORE AI</text>
<line x1="40" y1="166" x2="858" y2="166" stroke="#94A3B8" stroke-width="2" />
<text x="900" y="152" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#2F5D8A" font-size="11.5" font-weight="600" letter-spacing=".12em">SECOND HALF · 2025 → SEP 2026 · WITH AI</text>
<line x1="900" y1="166" x2="1560" y2="166" stroke="#3A5F8A" stroke-width="2" />
<rect x="40" y="190" width="254" height="196" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" />
<circle cx="73" cy="222" r="13" fill="#23395B" /><text x="73" y="226.5" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#fff" font-size="13" font-weight="700">1</text>
<text x="60" y="264" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">The revamp nobody shipped</text>
<text x="60" y="290" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">A custom system and dozens of</text>
<text x="60" y="309" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">polished screens, made before</text>
<text x="60" y="328" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">anything was tested.</text>
<rect x="60" y="342" width="96" height="26" rx="13" fill="#FBEEEE" stroke="#C98080" stroke-width="1" stroke-dasharray="5 4" /><text x="108.0" y="359.5" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#A33A3A" font-size="12.5" font-weight="600">Not built</text>
<rect x="322" y="190" width="254" height="196" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" />
<circle cx="355" cy="222" r="13" fill="#23395B" /><text x="355" y="226.5" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#fff" font-size="13" font-weight="700">2</text>
<text x="342" y="264" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">Embracing constraints</text>
<text x="342" y="290" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Decide what not to design.</text>
<text x="342" y="309" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Version every change by date.</text>
<text x="342" y="328" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Take mature defaults.</text>
<rect x="604" y="190" width="254" height="196" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" />
<circle cx="637" cy="222" r="13" fill="#23395B" /><text x="637" y="226.5" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#fff" font-size="13" font-weight="700">3</text>
<text x="624" y="264" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">Grow the system alongside</text>
<text x="624" y="290" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Redesign one area of a live</text>
<text x="624" y="309" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">screen at a time. Add a</text>
<text x="624" y="328" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">component only when needed.</text>
<rect x="624" y="342" width="160" height="26" rx="13" fill="#EAF3EC" stroke="#6A9C7C" stroke-width="1" /><text x="704.0" y="359.5" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#2F6B4A" font-size="12.5" font-weight="600">Small enough to ship</text>
<rect x="900" y="190" width="204" height="196" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" />
<circle cx="933" cy="222" r="13" fill="#23395B" /><text x="933" y="226.5" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#fff" font-size="13" font-weight="700">4</text>
<text x="920" y="264" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">Assets get cheap</text>
<text x="920" y="290" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Polished AI screens pulled</text>
<text x="920" y="309" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">talk into details, so I</text>
<text x="920" y="328" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">asked for plain wireframes.</text>
<rect x="1128" y="190" width="204" height="196" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" />
<circle cx="1161" cy="222" r="13" fill="#23395B" /><text x="1161" y="226.5" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#fff" font-size="13" font-weight="700">5</text>
<text x="1148" y="264" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">Design-ops pipeline</text>
<text x="1148" y="290" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Meeting → reviewed plan</text>
<text x="1148" y="309" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">→ Figma. A dated decision</text>
<text x="1148" y="328" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">log is the by-product.</text>
<rect x="1356" y="190" width="204" height="196" rx="6" fill="#fff" stroke="#CBD5E1" stroke-width="1" />
<circle cx="1389" cy="222" r="13" fill="#23395B" /><text x="1389" y="226.5" text-anchor="middle" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#fff" font-size="13" font-weight="700">6</text>
<text x="1376" y="264" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">System as open code</text>
<text x="1376" y="290" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Design system v2 on</text>
<text x="1376" y="309" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">shadcn/ui, plus a docs site</text>
<text x="1376" y="328" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">people and AI can both read.</text>
<line x1="296" y1="288.0" x2="320" y2="288.0" fill="none" stroke="#23395B" stroke-width="1.5" />
<polygon points="321.05,288.00 310.55,293.25 310.55,282.75" fill="#23395B" /><line x1="578" y1="288.0" x2="602" y2="288.0" fill="none" stroke="#23395B" stroke-width="1.5" />
<polygon points="603.05,288.00 592.55,293.25 592.55,282.75" fill="#23395B" /><line x1="1106" y1="288.0" x2="1126" y2="288.0" fill="none" stroke="#23395B" stroke-width="1.5" />
<polygon points="1127.05,288.00 1116.55,293.25 1116.55,282.75" fill="#23395B" /><line x1="1334" y1="288.0" x2="1354" y2="288.0" fill="none" stroke="#23395B" stroke-width="1.5" />
<polygon points="1355.05,288.00 1344.55,293.25 1344.55,282.75" fill="#23395B" /><line x1="860" y1="288.0" x2="898" y2="288.0" fill="none" stroke="#3A5F8A" stroke-width="1.75" />
<polygon points="899.23,288.00 886.98,294.12 886.98,281.88" fill="#3A5F8A" /><text x="40" y="436" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="11.5" font-weight="600" letter-spacing=".12em">WHAT CARRIED THE SHARED LANGUAGE</text>
<rect x="40" y="452" width="818" height="112" rx="8" fill="#F1F4F7" stroke="#CBD5E1" stroke-width="1" />
<text x="64" y="490" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#1E293B" font-size="15.5" font-weight="600">Design assets</text>
<text x="64" y="516" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Figma screens and a design system that grew with them. Decisions lived inside the frames;</text>
<text x="64" y="535" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">the reasons stayed in my head and in meetings.</text>
<rect x="900" y="452" width="660" height="112" rx="8" fill="#E8EEF6" stroke="#3A5F8A" stroke-width="1.25" />
<text x="924" y="490" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#2F5D8A" font-size="15.5" font-weight="600">Design intent</text>
<text x="924" y="516" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">Why each design won, written down as I work. The team reads it,</text>
<text x="924" y="535" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13">and so does the AI agent that builds the assets.</text>
<text x="40" y="612" font-family="'IBM Plex Sans',Inter,'Helvetica Neue',Arial,'Noto Sans CJK JP',sans-serif" fill="#5B6675" font-size="13" font-style="italic">The job never changed. What carried it did.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>