<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="900" viewBox="0 0 1040 900" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Ingestion worker: Pillow downscaling, 60 s timeout, 360 s visibility</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3E4C59"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A3B3B"/>
    </marker>
    <style>
      .h1{font-size:20px;font-weight:600;fill:#1F2933}
      .sub{font-size:13px;fill:#616E7C}
      .t{font-size:14px;font-weight:600;fill:#1F2933}
      .lbl{font-size:12.5px;fill:#1F2933}
      .lblS{font-size:11.5px;fill:#616E7C}
      .red{font-size:11.5px;fill:#8A3B3B}
      .sec{font-size:11px;font-weight:700;fill:#616E7C;letter-spacing:0.08em}
      .mono{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11.5px;fill:#1F2933}
      .flow{stroke:#3E4C59;stroke-width:1.4;fill:none}
      .fail{stroke:#8A3B3B;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1040" height="900" fill="#FFFFFF"/>

  <text x="40" y="44" class="h1">3 · Ingestion worker: downscale before the models, size the timeouts together</text>
  <text x="40" y="66" class="sub">The S3 object stays full-size. Only the bytes sent to Titan and Converse are shrunk. Queue visibility is set from the Lambda timeout.</text>

  <!-- Pipeline -->
  <text x="40" y="104" class="sec">PIPELINE</text>
  <rect x="40" y="116" width="150" height="70" rx="6" fill="#F5F7FA" stroke="#9AA5B1"/>
  <text x="56" y="142" class="t">S3 media bucket</text>
  <text x="56" y="162" class="lblS">ObjectCreated event</text>
  <text x="56" y="177" class="lblS">{userId}/{postId}/{fileId}</text>
  <line x1="190" y1="151" x2="228" y2="151" class="flow" marker-end="url(#arr)"/>

  <rect x="230" y="116" width="180" height="70" rx="6" fill="#F5F7FA" stroke="#9AA5B1"/>
  <text x="246" y="142" class="t">SQS ingest queue</text>
  <text x="246" y="162" class="lbl">visibility <tspan font-weight="700">360 s</tspan></text>
  <text x="246" y="177" class="lbl">maxReceiveCount <tspan font-weight="700">5</tspan></text>
  <line x1="410" y1="151" x2="448" y2="151" class="flow" marker-end="url(#arr)"/>

  <rect x="450" y="116" width="190" height="70" rx="6" fill="#E8EEF4" stroke="#2F4B66"/>
  <text x="466" y="142" class="t">Worker Lambda</text>
  <text x="466" y="162" class="lbl">timeout <tspan font-weight="700">60 s</tspan> · 512 MB</text>
  <text x="466" y="177" class="lbl">reserved concurrency 2</text>
  <line x1="640" y1="151" x2="678" y2="151" class="flow" marker-end="url(#arr)"/>

  <rect x="680" y="116" width="150" height="70" rx="6" fill="#E8EEF4" stroke="#2F4B66" stroke-width="1.6"/>
  <text x="696" y="142" class="t">_fit_for_models</text>
  <text x="696" y="162" class="lblS">Pillow, see detail below</text>
  <line x1="830" y1="138" x2="858" y2="128" class="flow" marker-end="url(#arr)"/>
  <line x1="830" y1="164" x2="858" y2="174" class="flow" marker-end="url(#arr)"/>

  <rect x="860" y="104" width="150" height="44" rx="6" fill="#F5F7FA" stroke="#9AA5B1"/>
  <text x="872" y="122" class="lbl" font-weight="600">Titan embed image</text>
  <text x="872" y="139" class="lblS">≤ 2048 × 2048 px</text>
  <rect x="860" y="154" width="150" height="44" rx="6" fill="#F5F7FA" stroke="#9AA5B1"/>
  <text x="872" y="172" class="lbl" font-weight="600">Converse classify</text>
  <text x="872" y="189" class="lblS">≤ 3.75 MB per image</text>

  <line x1="935" y1="198" x2="935" y2="226" class="flow" marker-end="url(#arr)"/>
  <rect x="820" y="228" width="180" height="44" rx="6" fill="#F5F7FA" stroke="#9AA5B1"/>
  <text x="832" y="246" class="lbl" font-weight="600">S3 Vectors + DynamoDB</text>
  <text x="832" y="263" class="lblS">vector key = object key</text>

  <!-- failure path -->
  <path d="M545,186 L545,212 L320,212 L320,188" class="fail" marker-end="url(#arrRed)"/>
  <text x="332" y="236" class="red">batchItemFailures → message reappears after visibility</text>
  <text x="332" y="256" class="red">retryable error: visibility = 20·2^(n−1) s, cap 900 s</text>
  <path d="M262,186 L262,251 L192,251" class="fail" marker-end="url(#arrRed)"/>
  <rect x="40" y="230" width="150" height="42" rx="6" fill="#F6ECEC" stroke="#8A3B3B"/>
  <text x="56" y="249" class="t" style="fill:#8A3B3B">DLQ</text>
  <text x="56" y="265" class="red">after 5 receives</text>

  <!-- Detail: fit for models -->
  <line x1="40" y1="300" x2="1000" y2="300" stroke="#E4E7EB"/>
  <text x="40" y="330" class="sec">_fit_for_models() · PILLOW</text>

  <rect x="40" y="344" width="160" height="56" rx="6" fill="#F5F7FA" stroke="#9AA5B1"/>
  <text x="56" y="368" class="t">image bytes</text>
  <text x="56" y="386" class="lblS">from s3.get_object</text>
  <line x1="200" y1="372" x2="246" y2="372" class="flow" marker-end="url(#arr)"/>

  <polygon points="350,326 452,372 350,418 248,372" fill="#FFFFFF" stroke="#2F4B66" stroke-width="1.4"/>
  <text x="350" y="364" text-anchor="middle" class="lbl">long side ≤ 2048 px</text>
  <text x="350" y="380" text-anchor="middle" class="lbl">and ≤ 3.5 MB?</text>

  <line x1="452" y1="372" x2="498" y2="372" class="flow" marker-end="url(#arr)"/>
  <text x="462" y="364" class="lblS">no</text>
  <line x1="350" y1="418" x2="350" y2="446" class="flow" marker-end="url(#arr)"/>
  <text x="358" y="438" class="lblS">yes</text>
  <rect x="270" y="448" width="160" height="34" rx="6" fill="#EAF2EC" stroke="#3D6B4F"/>
  <text x="350" y="470" text-anchor="middle" class="lbl">return original bytes</text>

  <g>
    <rect x="500" y="352" width="120" height="40" rx="6" fill="#E8EEF4" stroke="#2F4B66"/>
    <text x="560" y="377" text-anchor="middle" class="mono">exif_transpose</text>
    <line x1="620" y1="372" x2="638" y2="372" class="flow" marker-end="url(#arr)"/>
    <rect x="640" y="352" width="90" height="40" rx="6" fill="#E8EEF4" stroke="#2F4B66"/>
    <text x="685" y="377" text-anchor="middle" class="mono">→ RGB</text>
    <line x1="730" y1="372" x2="748" y2="372" class="flow" marker-end="url(#arr)"/>
    <rect x="750" y="352" width="120" height="40" rx="6" fill="#E8EEF4" stroke="#2F4B66"/>
    <text x="810" y="377" text-anchor="middle" class="mono">thumbnail(2048)</text>
    <line x1="870" y1="372" x2="888" y2="372" class="flow" marker-end="url(#arr)"/>
    <rect x="890" y="352" width="110" height="40" rx="6" fill="#E8EEF4" stroke="#2F4B66"/>
    <text x="945" y="377" text-anchor="middle" class="mono">JPEG q85</text>
  </g>
  <text x="500" y="414" class="lblS">rotate per EXIF (phones store sideways pixels + an orientation tag), drop alpha/CMYK,</text>
  <text x="500" y="430" class="lblS">fit inside 2048 × 2048 keeping aspect ratio, re-encode compactly.</text>

  <rect x="500" y="446" width="500" height="46" rx="6" fill="#F5F7FA" stroke="#CBD2D9"/>
  <text x="514" y="466" class="lbl"><tspan font-weight="600">Example.</tspan> 4032 × 3024, 6 MB phone JPEG → 2048 × 1536, well under 3.5 MB</text>
  <text x="514" y="483" class="lblS">Embedding a smaller copy loses nothing: the model resizes internally anyway.</text>

  <rect x="40" y="500" width="430" height="40" rx="6" fill="#F6ECEC" stroke="#8A3B3B"/>
  <text x="54" y="517" class="red" font-weight="700">Before the fix (no Pillow):</text>
  <text x="54" y="533" class="red">Titan "Image exceeds max pixels" → fail ×5 → DLQ (18 msgs)</text>

  <!-- Timing -->
  <line x1="40" y1="566" x2="1000" y2="566" stroke="#E4E7EB"/>
  <text x="40" y="596" class="sec">WHY 60 s AND 360 s BELONG TOGETHER</text>

  <!-- axis -->
  <g>
    <line x1="80" y1="690" x2="980" y2="690" stroke="#7B8794"/>
    <!-- 0..360 s mapped to 80..980 => 2.5 px per s -->
    <line x1="80" y1="686" x2="80" y2="694" stroke="#7B8794"/><text x="80" y="710" text-anchor="middle" class="lblS">0 s</text>
    <line x1="230" y1="686" x2="230" y2="694" stroke="#7B8794"/><text x="230" y="710" text-anchor="middle" class="lblS">60</text>
    <line x1="380" y1="686" x2="380" y2="694" stroke="#7B8794"/><text x="380" y="710" text-anchor="middle" class="lblS">120</text>
    <line x1="530" y1="686" x2="530" y2="694" stroke="#7B8794"/><text x="530" y="710" text-anchor="middle" class="lblS">180</text>
    <line x1="680" y1="686" x2="680" y2="694" stroke="#7B8794"/><text x="680" y="710" text-anchor="middle" class="lblS">240</text>
    <line x1="830" y1="686" x2="830" y2="694" stroke="#7B8794"/><text x="830" y="710" text-anchor="middle" class="lblS">300</text>
    <line x1="980" y1="686" x2="980" y2="694" stroke="#7B8794"/><text x="980" y="710" text-anchor="middle" class="lblS">360</text>

    <rect x="80" y="612" width="900" height="26" rx="3" fill="#F5F7FA" stroke="#9AA5B1"/>
    <text x="92" y="630" class="lbl">message invisible to other consumers (visibility timeout = 360 s = 6 × 60 s)</text>

    <rect x="80" y="648" width="150" height="26" rx="3" fill="#E8EEF4" stroke="#2F4B66"/>
    <text x="92" y="666" class="lbl">one invocation ≤ 60 s</text>
    <rect x="230" y="648" width="750" height="26" rx="3" fill="#FFFFFF" stroke="#CBD2D9" stroke-dasharray="4 3"/>
    <text x="244" y="666" class="lblS">headroom: batch waiting for a free slot (concurrency 2), Lambda's own retries of throttled invocations</text>
  </g>

  <rect x="40" y="732" width="470" height="140" rx="6" fill="#F6ECEC" stroke="#8A3B3B"/>
  <text x="56" y="756" class="t" style="fill:#8A3B3B">If visibility were shorter than the timeout</text>
  <text x="56" y="780" class="lbl">A 60 s job with, say, 30 s visibility reappears mid-run.</text>
  <text x="56" y="800" class="lbl">A second worker picks it up → duplicate Bedrock calls,</text>
  <text x="56" y="820" class="lbl">ApproximateReceiveCount climbs for nothing, and a</text>
  <text x="56" y="840" class="lbl">healthy message can reach the DLQ.</text>
  <text x="56" y="860" class="lblS">(PutVectors by object key keeps results idempotent, not cheap.)</text>

  <rect x="530" y="732" width="470" height="140" rx="6" fill="#EAF2EC" stroke="#3D6B4F"/>
  <text x="546" y="756" class="t" style="fill:#3D6B4F">The rule used: visibility ≥ 6 × function timeout</text>
  <text x="546" y="780" class="lbl">AWS's guidance for SQS-triggered Lambdas. The extra 5×</text>
  <text x="546" y="800" class="lbl">covers time a polled batch can spend waiting while the</text>
  <text x="546" y="820" class="lbl">function is throttled, which is likely at concurrency 2.</text>
  <text x="546" y="840" class="lbl">60 s itself: Pillow decode + embed + classify + writes.</text>
  <text x="546" y="860" class="lblS">Worst case to DLQ for a poison message: ~5 × 360 s ≈ 30 min.</text>
</svg>
